services:
  api:
    container_name: NutricaoEquina-API
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:senha123@db:5432/nutricao?schema=schnutri
    depends_on:
      - db
    volumes:
      - ./backend:/app

  db:
    image: postgres:16-alpine   # Versão mais leve
    container_name: NutricaoEquina-Postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: nutricao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: