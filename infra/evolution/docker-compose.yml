# Evolution API — stack da VPS Backend (produção). Roteiro: docs/DEPLOY-PRODUCAO.md, Etapa 14.
# Uso: este arquivo em /opt/evolution, o .env ao lado (ver .env.exemplo) e:
#   sudo docker compose up -d
#
# A Evolution NÃO tem nome nem porta públicos: o S2Vet fala com ela em http://127.0.0.1:8080,
# dentro do próprio Backend (EVOLUTION_URL no backend.env), e ela só SAI para o WhatsApp.
#
# Diferenças do ambiente dev local (Windows, sem Docker, código-fonte 2.3.7): aqui a Evolution
# tem Postgres e Redis PRÓPRIOS (isolados do banco do S2Vet) e cache Redis ligado.

# Nome fixo do projeto: é ele que dá nome aos volumes (evolution_evolution_instances…), e o
# script de backup (Etapa 11) os procura por esse nome — independe da pasta onde o arquivo está.
name: evolution

# Limite dos logs de cada contêiner (3 arquivos de 10 MB). Sem isso o Docker guarda o log
# inteiro para sempre e ele cresce até encher o disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  evolution-api:
    # 🔴 Versão FIXA = a testada no desenvolvimento (código-fonte 2.3.7, commit fa09d37).
    # NUNCA ':latest' — em 2026-10 ela já apontava para outra versão, e atualização silenciosa
    # da Evolution pode quebrar o envio de WhatsApp de todas as clínicas. Para atualizar:
    # testar a nova versão no dev, trocar a etiqueta aqui e rodar 'docker compose up -d'.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    logging: *logging
    ports:
      # Só loopback. "8080:8080" faz o Docker passar por cima do UFW e expõe na internet a API
      # que controla o WhatsApp de todas as clínicas. O S2Vet fala com ela em 127.0.0.1:8080.
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://127.0.0.1:8080}
      LANGUAGE: pt-BR

      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD no .env}@evolution-db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"

      DEL_INSTANCE: "false"
      QRCODE_LIMIT: 30
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-db
      - evolution-redis

  evolution-db:
    # Banco PRÓPRIO da Evolution, sem porta publicada: só a evolution-api o alcança, pela rede
    # interna do Docker. ⚠️ Não trocar para 18 sem planejar: a imagem do 18 mudou a pasta dos
    # dados e o volume atual deixaria de ser reconhecido.
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

  evolution-redis:
    # Cache, sem porta publicada (idem).
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redis:
